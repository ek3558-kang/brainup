name: Build BrainUp Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project files
        run: flutter create --platforms android --project-name brainup --org com.brainup .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze lib --no-fatal-infos
      - name: Build APK
        run: flutter build apk --debug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: brainup-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
